name: ElementX

schemes:
  Gua:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        ElementX:
          - running
          - testing
          - profiling
          - analyzing
          - archiving
    profile:
      config: Release
    run:
      config: Debug
      environmentVariables:
        - variable: HTTPS_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: HTTP_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: UI_TESTS_SCREEN
          value: ""
          isEnabled: false
        - variable: RESET_APP_SETTINGS
          value: "true"
          isEnabled: false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ElementX
      testPlans:
        - path: ../../UnitTests/SupportingFiles/UnitTests.xctestplan
          defaultPlan: true

targets:
  ElementX:
    type: application
    platform: iOS

    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: colors/background-color
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          [
            {
              CFBundleTypeRole: Editor,
              CFBundleURLName: "Application",
              CFBundleURLSchemes: [
                  $(BASE_BUNDLE_IDENTIFIER), # The app's own scheme for custom routes
                  "matrix", # Matrix URI scheme for permalinks
                ],
            },
          ]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        productionAppName: $(PRODUCTION_APP_NAME)
        isNightlyBuild: $(IS_NIGHTLY_BUILD)
        GuaDefaultAccountProvider: $(DEFAULT_ACCOUNT_PROVIDER)
        GuaOidcRedirectURL: $(OIDC_REDIRECT_URL)
        GuaOidcStaticRegistrations: $(OIDC_STATIC_REGISTRATIONS)
        # LOCAL DEV ONLY: allow plain-HTTP to loopback/.local hosts so the app can
        # reach the local stack (Synapse :8008, MAS :8090). Does NOT relax ATS for
        # remote servers. Harmless to ship, but tied to the local DEFAULT_ACCOUNT_PROVIDER.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [INSendMessageIntent, INStartCallIntent]
        NSCameraUsageDescription: To take photos or videos and send them as messages, $(APP_DISPLAY_NAME) needs access to the camera.
        NSMicrophoneUsageDescription: To record and send messages with audio, $(APP_DISPLAY_NAME) needs access to the microphone.
        NSPhotoLibraryAddUsageDescription: This lets you save images and videos to your photo library.
        NSLocationWhenInUseUsageDescription: Allow location access so that $(APP_DISPLAY_NAME) can share your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: To share your live location, $(APP_DISPLAY_NAME) needs location access when the app is in the background.
        NSFaceIDUsageDescription: $(APP_DISPLAY_NAME) uses Face ID to unlock the app, so you don’t have to type your passcode every time.
        NSContactsUsageDescription: $(APP_DISPLAY_NAME) checks your contacts privately to find which of them are already here. Your contacts are never stored.
        UIBackgroundModes: [audio, fetch, processing, voip, location]
        BGTaskSchedulerPermittedIdentifiers:
          [
            $(BACKGROUND_APP_REFRESH_TASK_IDENTIFIER),
            $(BACKGROUND_SEARCH_BACKFILL_TASK_IDENTIFIER),
          ]
        UTExportedTypeDeclarations:
          - UTTypeConformsTo: [public.text]
            UTTypeDescription: Mention Pills
            UTTypeIdentifier: $(PILLS_UT_TYPE_IDENTIFIER)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mention Pills
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: $(PILLS_UT_TYPE_IDENTIFIER)
        LSSupportsOpeningDocumentsInPlace: false

    entitlements:
      path: ElementX.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.associated-domains:
        - webcredentials:gua.global
        # The non-public dev host's webcredentials entry is intentionally NOT committed.
        # Add `- webcredentials:<dev-host>` locally (and mark this file assume-unchanged) if you
        # need passkeys against the dev server.
        #        - applinks:element.io
        #        - applinks:app.element.io
        #        - applinks:staging.element.io
        #        - applinks:develop.element.io
        #        - applinks:mobile.element.io
        #        - applinks:matrix.to
        #        # - applinks:localhost?mode=developer # developer mode only works with https (but self-signed is fine).
        #        - webcredentials:*.element.io
        # com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        keychain-access-groups:
          - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_MODULE_NAME: ElementX
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: ElementX/SupportingFiles/ElementX-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: GeneratedInterface-Swift.h
        PILLS_UT_TYPE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).pills
        DEVELOPMENT_ASSET_PATHS: Components/DevelopmentAssets/Media
        SWIFT_VERSION: 6
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        OTHER_SWIFT_FLAGS:
          - "-DIS_MAIN_APP"
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
          # Release archives target PROD: GuaDeployment.current resolves to .production, whose
          # resolver / identity / account-provider hosts are committed in GuaDeployment.swift, so
          # a prod build needs no injected secrets. Dev TestFlight builds come from the Dev
          # variant (Variants/Dev/dev.yml), which re-adds GUA_DEVELOPMENT and its own bundle id.

    preBuildScripts:
      - name: 🛠 SwiftGen
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftgen >/dev/null; then
              swiftgen config run --config Tools/SwiftGen/swiftgen-config.yml
          else
              echo "warning: SwiftGen not installed, download from https://github.com/SwiftGen/SwiftGen"
          fi
      - name: 🧙 Sourcery - Generate mocks
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which sourcery >/dev/null; then
              sourcery --config Tools/Sourcery/AutoMockableConfig.yml
          else
              echo "warning: Sourcery not installed, run swift run tools setup-project"
          fi

      - name: 🧙 Sourcery - Generate preview tests
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which sourcery >/dev/null; then
              sourcery --config Tools/Sourcery/PreviewTestsConfig.yml
          else
              echo "warning: Sourcery not installed, run swift run tools setup-project"
          fi

      - name: 🧙 Sourcery - Generate Accessibility Tests
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which sourcery >/dev/null; then
              sourcery --config Tools/Sourcery/TestablePreviewsDictionary.yml
              sourcery --config Tools/Sourcery/AccessibilityTests.yml
          else
              echo "warning: Sourcery not installed, run swift run tools setup-project"
          fi

    postBuildScripts:
      - name: ⚠️ SwiftLint
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint >/dev/null; then
              swiftlint
          else
              echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
      - name: 🧹 SwiftFormat
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          # Prefer the BuildTools pin CI uses: an older Homebrew swiftformat rejects options in .swiftformat.
          swiftformat="$PROJECT_DIR/BuildTools/.build/release/swiftformat"
          [ -x "$swiftformat" ] || swiftformat=swiftformat
          if which "$swiftformat" >/dev/null; then
              "$swiftformat" --lint --lenient "$PROJECT_DIR"
          else
              echo "warning: SwiftFormat not installed, download from https://github.com/nicklockwood/SwiftFormat"
          fi
      - name: Alias pt to pt-BR
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          # GUA FORK: iOS picks pt-BR for pt-PT only when no other listed language matches.
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          rm -rf "$resources/pt.lproj"
          cp -R "$resources/pt-BR.lproj" "$resources/pt.lproj"

    dependencies:
      - target: NSE
      - target: ShareExtension
      - target: MatrixRustSDKMocks
      - package: MatrixRustSDK
        embed: true
      - package: Compound
      - package: BuildExtensions
        product: Macros
      - package: Algorithms
      - package: AsyncAlgorithms
      - package: AnalyticsEvents
      - package: Collections
      - package: DeviceKit
      - package: EmbeddedElementCall
      - package: KeychainAccess
      - package: Kingfisher
      - package: KZFileWatchers
      - package: LoremSwiftum
      - package: LRUCache
      - package: Mantis
      - target: MapLibreInterface
        embed: true
      # Embedded but not linked, dlopen'd on first map use
      - target: MapLibreShim
        link: false
        embed: true
      # The app just embeds the framework so it's in the bundle for the shim's load
      # command to resolve against.
      - framework: ../../MapLibre.framework
        implicit: true
        link: false
        embed: true
      - package: ElementCall
        product: ElementCall
      - package: PostHog
      - package: SwiftState
      - package: GZIP
      - package: Sentry
        products:
          - Sentry
          - SentrySwiftUI
      - package: Version
      - package: Emojibase
      - package: WysiwygComposer
      - package: SwiftOGG
      - package: SwiftSoup
      - package: SwiftFlow
        product: Flow
      - package: DSWaveformImage
        product: DSWaveformImageViews

    sources:
      - path: ../Sources
        excludes:
          - Other/Extensions/XCTestCase.swift
          - Other/Extensions/XCUIElement.swift
      - path: ../../Components/Secrets/Secrets.swift
      - path: ../Resources
        # Upstream's other languages stay on disk for the Localazy sync but never ship.
        excludes:
          - Localizations/ar.lproj
          - Localizations/be.lproj
          - Localizations/bg.lproj
          - Localizations/ca.lproj
          - Localizations/cs.lproj
          - Localizations/cy.lproj
          - Localizations/da.lproj
          - Localizations/de.lproj
          - Localizations/el.lproj
          - Localizations/en-US.lproj
          - Localizations/et.lproj
          - Localizations/eu.lproj
          - Localizations/fa.lproj
          - Localizations/fi.lproj
          - Localizations/hr.lproj
          - Localizations/hu.lproj
          - Localizations/id.lproj
          - Localizations/it.lproj
          - Localizations/ja.lproj
          - Localizations/ka.lproj
          - Localizations/ko.lproj
          - Localizations/lt.lproj
          - Localizations/nb.lproj
          - Localizations/nl.lproj
          - Localizations/pl.lproj
          - Localizations/pt.lproj
          - Localizations/ro.lproj
          - Localizations/ru.lproj
          - Localizations/sk.lproj
          - Localizations/sv.lproj
          - Localizations/tr.lproj
          - Localizations/uk.lproj
          - Localizations/ur.lproj
          - Localizations/uz.lproj
          - Localizations/vi.lproj
          - Localizations/zh-Hans.lproj
          - Localizations/zh-Hant-TW.lproj
      - path: ../SupportingFiles
      - path: ../../Tools/Scripts/Templates/SimpleScreenExample/ElementX
      - path: ../../Components/DevelopmentAssets/Media

      # This is required for testing purposes... The problem with unit tests is that if you
      # try to `@testable import NSE` you can only get the definition of files, but due to a
      # limitation in how they work, they can only compile files that are part of the main test
      # target, so linking will fail. The solution is to just have the main app to reference the
      # extension code, and test it directly.
      - path: ../../NSE/Sources
