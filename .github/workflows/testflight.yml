name: TestFlight

# One-tap TestFlight release.
#
# Archives, signs, and uploads the Gua iOS app to TestFlight.
#
# Signing is half cloud-managed. The distribution CERTIFICATE is supplied as a .p12
# secret and imported into a throwaway keychain, because creating a certificate
# through an App Store Connect API key needs Admin on the account and this key does
# not have it; without the certificate, export dies with "Cloud signing permission
# error" before it even looks at profiles. The provisioning PROFILES for all three
# signed targets (global.gua, global.gua.nse, global.gua.shareextension) are still
# created automatically by xcodebuild via -allowProvisioningUpdates, which the key
# is allowed to do. So: one .p12 to manage, no .mobileprovision files, no Match repo.
#
# Release paths, in order of how often they are used:
#   - label a PR `deploy:qa` -> archives that PR's branch and uploads it to the Gua QA
#                               app, so a change can be handed to testers before it is
#                               merged. Pushing more commits rebuilds it automatically.
#   - merge to develop       -> stages the PROD upload, which waits for an approver on
#                               the `production` environment. Merging never publishes
#                               on its own.
#   - workflow_dispatch      -> the same two paths by hand, for either app.
#
# An unlabelled PR does nothing here on purpose: an archive costs ~25 minutes of a
# metered macOS runner, which is far too expensive to spend on every push.
#
# develop, not main, is this fork's integration branch: every PR merges into develop,
# and `main` is the dormant branch inherited from upstream element-x-ios.
#
# !! REPO SETTING REQUIRED BEFORE THE PROD PATH CAN EVER RUN !!
# The `production` environment currently carries a deployment branch policy of `main` only.
# Because prod is triggered by a push to `develop`, GitHub will REJECT the job outright
# ("Branch develop is not allowed to deploy to production due to environment protection
# rules") rather than hold it for an approver. Add `develop` to that environment's
# deployment branch policy (Settings -> Environments -> production), or the first merge to
# develop fails instead of staging a release. Do NOT "fix" this by dropping the
# environment: the environment IS the approval gate.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ASC_ISSUER_ID   App Store Connect API issuer id (UUID)
#   ASC_KEY_ID      App Store Connect API key id
#   ASC_PRIVATE_KEY Contents of the AuthKey_<KEY_ID>.p8 file (full PEM, multi-line)
#   ASC_APP_ID_DEV  The QA app record's numeric Apple ID (only for environment=dev).
#   ASC_APP_ID      The app's numeric Apple ID (so the upload targets the right
#                   app record on multi-app accounts)
#   GUA_DEV_RESOLVER_BASE_URL, GUA_DEV_IDENTITY_SERVICE_BASE_URL,
#   GUA_DEV_ACCOUNT_PROVIDER
#                   The dev backend endpoints baked into a QA build. Required for
#                   every `deploy:qa` run; the build fails loudly without them.
# See docs/TESTFLIGHT.md for setup details.

on:
  push:
    # Production ships from `main` only. The `production` environment also carries a
    # main-only branch policy, so a release cannot be staged from anywhere else even
    # if this list is widened by mistake.
    branches: [main]
  # `labeled` is what makes the QA path work: the PR that opened without the label
  # gets its build the moment someone adds it, without needing an empty push.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: "Which app to build: prod (global.gua, gua.global backend) or dev (Gua QA, global.gua.dev, dev backend)"
        required: true
        type: choice
        options: [prod, dev]
        default: prod
      whats_new:
        description: "Optional 'What to Test' note for this TestFlight build"
        required: false
        type: string

# Default for every job. `pull-requests: write` is granted only to the job that actually
# comments (see the testflight job), so the gate job cannot write anything at all.
permissions:
  contents: read

env:
  # Put this label on a PR to ship that PR's branch to the Gua QA app. Only people with
  # write access can label, which is what keeps this from being an open door on a public
  # repo. The internal plumbing still calls this variant "dev" (environment=dev, lane
  # config_dev, bundle global.gua.dev); "QA" is only what testers see.
  DEPLOY_LABEL: deploy:qa

# Scoped per PR (and per branch otherwise) rather than one global lane: pushing a fixup
# to a labelled PR should supersede that PR's in-flight archive instead of queueing a
# second 25-minute macOS run. Runs off develop and manual dispatches queue instead of
# cancelling, because killing a prod run mid-upload leaves a half-delivered build.
concurrency:
  group: testflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on a cheap Linux runner so the decision itself costs nothing. Everything
  # below keys off its outputs, and the expensive macOS job is skipped outright when
  # `build` is false.
  gate:
    name: Decide what to ship
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      target: ${{ steps.gate.outputs.target }}
      environment: ${{ steps.gate.outputs.environment }}
      ref: ${{ steps.gate.outputs.ref }}
    steps:
      - id: gate
        env:
          # Bound as env instead of being interpolated into the script body: these come
          # from whoever opened the PR, and must never be able to become shell syntax.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_DEPLOY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, env.DEPLOY_LABEL) }}
          DISPATCH_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          build=false
          target=""
          ref=""
          environment=""

          case "${{ github.event_name }}" in
            workflow_dispatch)
              build=true
              target="$DISPATCH_ENV"
              ;;
            push)
              # Only develop reaches here (see the trigger), and a merge always means prod.
              build=true
              target=prod
              ;;
            pull_request)
              # All three conditions are required. The same-repo check is the security
              # control: a PR from a fork must never reach the App Store Connect key,
              # and label-gating alone would not stop that, because a fork PR's job
              # would otherwise run with the repo's secrets in scope.
              if [ "$HEAD_REPO" = "${{ github.repository }}" ] && [ "$HAS_DEPLOY_LABEL" = "true" ]; then
                build=true
                target=dev
                # Archive the PR branch itself, not the ephemeral merge commit, so what
                # testers install is exactly what the author pushed.
                ref="$HEAD_SHA"
              fi
              ;;
          esac

          if [ "$build" = "true" ]; then
            case "$target" in
              # Prod uploads run under the `production` environment, whose required
              # reviewers (the deploy-approvers team) hold the job before step one.
              prod) environment=production ;;
              dev) environment=dev ;;
              *) echo "::error::Unknown target '$target'"; exit 1 ;;
            esac
            echo "Building **$target** (environment: \`$environment\`)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "No TestFlight build: PRs from forks cannot be signed, because the App Store Connect key is not exposed to them. Push the branch to this repo to ship it to QA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No TestFlight build: add the \`$DEPLOY_LABEL\` label to this PR to ship it to the Gua QA app." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "build=$build"
            echo "target=$target"
            echo "environment=$environment"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

  testflight:
    name: Archive & upload (${{ needs.gate.outputs.target }})
    needs: gate
    if: needs.gate.outputs.build == 'true'
    # macos-26, not macos-15: the app calls APIs that only exist in the iOS 26 SDK
    # (ProcessInfo.isiOSAppOnVision, guarded by #available at runtime but still
    # required to exist at compile time), and macos-15 tops out at Xcode 16.4.
    # unit_tests.yml already runs here for the same reason.
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      # So a labelled PR can be told which build number its testers should install.
      pull-requests: write
    # Derived from `target` itself rather than a separate gate output, so the two can never
    # disagree: anything that is not an explicit QA build routes to `production` and waits for
    # an approver. A gate bug therefore fails towards the gate, never around it.
    environment: ${{ needs.gate.outputs.target == 'dev' && 'dev' || 'production' }}

    env:
      SCHEME: Gua
      CONFIGURATION: Release
      ARCHIVE_PATH: ${{ github.workspace }}/build/Gua.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      EXPORT_OPTIONS: ${{ github.workspace }}/fastlane/exportOptions.plist
      # Each run gets a unique, monotonically increasing build number (the workflow
      # run number) so every upload is accepted by TestFlight.
      BUILD_NUMBER: ${{ github.run_number }}
      # Which app record this run targets. prod is the shipping app on the committed
      # gua.global endpoints; dev is the side-by-side Gua QA variant on the dev backend.
      TARGET_ENV: ${{ needs.gate.outputs.target }}
      BUNDLE_ID: ${{ needs.gate.outputs.target == 'dev' && 'global.gua.dev' || 'global.gua' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # Empty for push/dispatch, which means "the ref that triggered this run".
          # For a labelled PR the gate pins it to the PR's head commit.
          ref: ${{ needs.gate.outputs.ref }}
          # Every step after this one runs code from the checked-out branch (Fastfile,
          # project.yml, SwiftPM manifests). Don't leave the job's GITHUB_TOKEN sitting in
          # .git/config where that code can pick it up; nothing here needs git auth after
          # checkout, and the LFS fetch happens inside this action.
          persist-credentials: false

      - name: Select Xcode
        # The project needs the iOS 26 SDK, not merely "Xcode 16+". It calls
        # ProcessInfo.isiOSAppOnVision, which is guarded by #available at runtime
        # but must still exist in the SDK at compile time, so an older toolchain
        # fails deep in the archive with "has no member 'isiOSAppOnVision'".
        # ci_scripts/ci_common.sh pins the same version for every other workflow.
        #
        # There is deliberately NO "newest Xcode" fallback: if the image drops 26.x
        # we want a clear failure here rather than a confusing one 20 minutes later.
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26.5.0.app 2>/dev/null || true)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 26.x on this runner; the project needs the iOS 26 SDK. Available: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          # Assert the real version, in case the app bundle name and its contents disagree.
          XCODE_MAJOR="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          if [ -z "$XCODE_MAJOR" ] || [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::Xcode 26+ required for the iOS 26 SDK, found '$(xcodebuild -version | head -n1)'"
            exit 1
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Homebrew (xcodegen)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-xcodegen

      - name: Install build tools
        # xcodegen generates the project; xcbeautify prettifies xcodebuild output.
        # xcbeautify is usually preinstalled on macos-15 runners, so only fetch it
        # when missing to keep runs fast.
        run: |
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew install xcodegen
          command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Install gems
        # `config_dev` below runs through `bundle exec`, and Gemfile.lock pins exact
        # versions (fastlane 2.228.0 and ~50 others), so whatever fastlane happens to
        # be preinstalled on the runner does not satisfy it. Without this the archive
        # dies at the first bundle exec with Bundler::GemNotFound.
        #
        # This job selects its own Xcode and installs its own brew tools, so it
        # cannot use ci_common.sh's setup_github_actions_environment; these are the
        # two lines from it that matter here, kept identical to the rest of the repo.
        #
        # Deliberately NOT cached, unlike the test workflows. This job checks out
        # `needs.gate.outputs.ref`, which on the QA path is a pull request's own
        # branch, and it can also run in a privileged context from main or a
        # dispatch. Writing a gem cache after checking out branch code gives a
        # later privileged run something poisonable to restore, which is a poor
        # trade for a job that signs the app and uploads it to TestFlight. A cold
        # bundle install costs a couple of minutes against a ~25 minute archive.
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Inject dev backend endpoints
        # Dev builds only: prod endpoints (resolver/identity/account provider on
        # gua.global) are committed in GuaDeployment.swift, so a prod archive needs
        # no injected secrets at all.
        if: needs.gate.outputs.target == 'dev'
        # The committed Secrets/Secrets.swift holds localhost placeholders, which only
        # resolve on the simulator (localhost == the Mac). A TestFlight build runs on
        # real devices, where localhost is the phone itself, so it MUST point at the
        # network-reachable HTTPS dev backend instead. The dev hostnames are non-public
        # infra, so they live in repo secrets (never committed) and are written into
        # Secrets.swift here, before the project is generated. See docs/TESTFLIGHT.md.
        env:
          GUA_DEV_RESOLVER_BASE_URL: ${{ secrets.GUA_DEV_RESOLVER_BASE_URL }}
          GUA_DEV_IDENTITY_SERVICE_BASE_URL: ${{ secrets.GUA_DEV_IDENTITY_SERVICE_BASE_URL }}
          GUA_DEV_ACCOUNT_PROVIDER: ${{ secrets.GUA_DEV_ACCOUNT_PROVIDER }}
        run: |
          set -euo pipefail
          if [ -z "${GUA_DEV_RESOLVER_BASE_URL:-}" ] || [ -z "${GUA_DEV_IDENTITY_SERVICE_BASE_URL:-}" ] || [ -z "${GUA_DEV_ACCOUNT_PROVIDER:-}" ]; then
            echo "::error::Dev backend secrets are not set (GUA_DEV_RESOLVER_BASE_URL / GUA_DEV_IDENTITY_SERVICE_BASE_URL / GUA_DEV_ACCOUNT_PROVIDER). Without them the build ships localhost URLs and is dead on a real device. See docs/TESTFLIGHT.md."
            exit 1
          fi
          # Resolver + identity-service must be https:// — App Transport Security blocks
          # cleartext http on device, so an http URL would fail every request.
          for u in "$GUA_DEV_RESOLVER_BASE_URL" "$GUA_DEV_IDENTITY_SERVICE_BASE_URL"; do
            case "$u" in
              https://*) ;;
              *) echo "::error::'$u' must be an https:// URL (ATS blocks cleartext http on device)."; exit 1 ;;
            esac
          done
          cat > Secrets/Secrets.swift <<EOF
          enum Secrets {
              static let sentryDSN: String? = nil
              static let sentryRustDSN: String? = nil
              static let postHogHost: String? = nil
              static let postHogAPIKey: String? = nil
              static let rageshakeURL: String? = nil
              static let mapLibreAPIKey: String? = nil

              // Injected by the TestFlight workflow from repo secrets (dev backend).
              static let identityServiceBaseURL: String? = "${GUA_DEV_IDENTITY_SERVICE_BASE_URL}"
              static let resolverBaseURL: String? = "${GUA_DEV_RESOLVER_BASE_URL}"
              static let defaultAccountProvider: String? = "${GUA_DEV_ACCOUNT_PROVIDER}"
          }
          EOF
          echo "Wrote Secrets.swift with dev backend endpoints (values masked by Actions)."

      - name: Apply the Dev app variant
        # Switches bundle id / app group / OIDC redirect scheme to the dev app and
        # re-adds GUA_DEVELOPMENT on Release, so both apps install side by side.
        if: needs.gate.outputs.target == 'dev'
        run: bundle exec fastlane config_dev

      - name: Generate Xcode project
        # The .xcodeproj is generated from project.yml. For a dev build the previous
        # steps populated Secrets/Secrets.swift and applied the Dev variant; a prod
        # build generates straight from the committed spec.
        if: needs.gate.outputs.target != 'dev'
        run: xcodegen generate

      - name: Read marketing version
        # MARKETING_VERSION is the single source of truth in project.yml; read it
        # so the upload step can pass --bundle-short-version-string explicitly.
        run: |
          set -euo pipefail
          MARKETING_VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*//p' project.yml | head -n1 | tr -d '"')"
          if [ -z "$MARKETING_VERSION" ]; then
            echo "::error::Could not read MARKETING_VERSION from project.yml"
            exit 1
          fi
          echo "Marketing version: $MARKETING_VERSION (build $BUILD_NUMBER)"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_PRIVATE_KEY:-}" ]; then
            echo "::error::ASC_KEY_ID / ASC_PRIVATE_KEY secrets are not set. See docs/TESTFLIGHT.md"
            exit 1
          fi
          # Write the key under $RUNNER_TEMP (auto-wiped on hosted runners, and
          # shredded by the always-run cleanup step below for self-hosted runners).
          # We pass the path explicitly to both xcodebuild (-authenticationKeyPath)
          # and altool (--apiKeyPath), so there is no need to seed the well-known
          # ~/.appstoreconnect/private_keys dir or keep a second copy in $HOME.
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install the distribution certificate
        # Export fails without this, with "Cloud signing permission error" followed by
        # "No signing certificate 'iOS Distribution' found". Automatic signing tries to
        # CREATE a distribution certificate through the API key, and an App Store Connect
        # key cannot do that unless it holds Admin, so the whole export dies before it
        # gets as far as profiles.
        #
        # Supplying the real certificate removes the need to create one. Xcode can still
        # create the three provisioning PROFILES itself via -allowProvisioningUpdates,
        # which the key is allowed to do; it is only certificate creation that is barred.
        #
        # The keychain is created per run and deleted in the cleanup step, so nothing is
        # left behind on a self-hosted runner.
        env:
          DIST_CERT_P12: ${{ secrets.GUA_DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.GUA_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_CERT_P12:-}" ] || [ -z "${DIST_CERT_PASSWORD:-}" ]; then
            echo "::error::GUA_DIST_CERT_P12 / GUA_DIST_CERT_PASSWORD are not set. The runner has no signing identity, so exportArchive cannot sign. See docs/TESTFLIGHT.md for how to export the Apple Distribution identity as a .p12 and store it."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/gua-signing.keychain-db"
          # Random per run: this password only guards a keychain that exists for the
          # length of this job, and is never written anywhere persistent.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$CERT_PATH"

          # Without this, codesign prompts for keychain access and hangs the runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Keep the login keychain in the search list so system roots still resolve.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          echo "GUA_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          echo "Signing identities now available:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/([A-Z0-9]*)/(team)/g'
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::The imported .p12 contains no 'Apple Distribution' identity. Export the identity WITH its private key from Keychain Access."
            exit 1
          fi

      - name: Archive
        # The unique build number is injected as a CURRENT_PROJECT_VERSION build-setting
        # override (the project doesn't use apple-generic versioning, so agvtool is not
        # reliable). MARKETING_VERSION stays as defined in project.yml.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Gua.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Fetch provisioning profiles
        # -allowProvisioningUpdates cannot work with this App Store Connect key. Xcode's
        # cloud signing is a distinct authorisation path that the key is refused on, which
        # is why export reported "Cloud signing permission error" and then found no
        # profiles, even once a real distribution certificate was present.
        #
        # The ordinary provisioning API is NOT refused: the three Gua QA profiles in this
        # account were created through it. So fetch (creating when absent) with sigh, which
        # installs into ~/Library/MobileDevice/Provisioning Profiles, and sign manually
        # against what it installed.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # sigh wants the key as JSON rather than a bare .p8. Written under RUNNER_TEMP
          # and removed by the cleanup step alongside the .p8 itself.
          KEY_JSON="$RUNNER_TEMP/asc_key.json"
          python3 - "$KEY_JSON" <<'PYKEY'
          import json, os, sys
          json.dump({
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": os.environ["ASC_PRIVATE_KEY"],
              "in_house": False,
          }, open(sys.argv[1], "w"))
          PYKEY
          chmod 600 "$KEY_JSON"
          echo "ASC_KEY_JSON=$KEY_JSON" >> "$GITHUB_ENV"

          # The app and both extensions each need their own profile.
          for suffix in "" ".nse" ".shareextension"; do
            id="${BUNDLE_ID}${suffix}"
            echo "::group::Provisioning profile for $id"
            bundle exec fastlane run sigh \
              api_key_path:"$KEY_JSON" \
              app_identifier:"$id" \
              platform:ios \
              readonly:false \
              skip_install:false \
              output_path:"$RUNNER_TEMP" \
              filename:"${id}.mobileprovision"
            echo "::endgroup::"
          done

          # Map each bundle id to the profile NAME Apple returned, which is what the export
          # plist keys off. Reading it back from the installed profile avoids guessing at a
          # naming convention that Apple, not us, decides.
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '<key>method</key><string>app-store-connect</string>'
            echo '<key>destination</key><string>export</string>'
            echo '<key>signingStyle</key><string>manual</string>'
            echo '<key>signingCertificate</key><string>Apple Distribution</string>'
            echo '<key>manageAppVersionAndBuildNumber</key><false/>'
            echo '<key>uploadSymbols</key><true/>'
            echo '<key>stripSwiftSymbols</key><true/>'
            echo '<key>generateAppStoreInformation</key><false/>'
            echo '<key>provisioningProfiles</key><dict>'
            for suffix in "" ".nse" ".shareextension"; do
              id="${BUNDLE_ID}${suffix}"
              name="$(security cms -D -i "$RUNNER_TEMP/${id}.mobileprovision" | plutil -extract Name raw -)"
              echo "<key>${id}</key><string>${name}</string>"
            done
            echo '</dict></dict></plist>'
          } > "$RUNNER_TEMP/exportOptions.plist"
          plutil -lint "$RUNNER_TEMP/exportOptions.plist"
          echo "EXPORT_OPTIONS=$RUNNER_TEMP/exportOptions.plist" >> "$GITHUB_ENV"
          echo "Export options:"; plutil -p "$RUNNER_TEMP/exportOptions.plist"

      - name: Export IPA
        run: |
          set -euo pipefail
          # No -allowProvisioningUpdates and no API key: signing is fully manual against
          # the certificate and profiles installed above. Handing xcodebuild the key here
          # only sends it back to the cloud path that refuses us.
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            | xcbeautify || exit ${PIPESTATUS[0]}
          echo "IPA_PATH=$(ls "$EXPORT_PATH"/*.ipa | head -n1)" >> "$GITHUB_ENV"

      - name: Validate IPA
        # Fail fast on signing/entitlement/Info.plist problems App Store Connect
        # would reject, *before* spending minutes on the upload. altool can return
        # a zero exit even on failure, so we also grep the output for the success
        # marker. --apiKeyPath points at the $RUNNER_TEMP key written above.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Validating $IPA_PATH (build $BUILD_NUMBER)"
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --apiKeyPath "$ASC_KEY_PATH" \
            2>&1 | tee altool-validate.log
          if grep -qi 'No errors validating' altool-validate.log; then
            echo "Validation succeeded."
          else
            echo "::error::altool validation failed (see log above)."
            exit 1
          fi

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Per-app record: prod uploads to ASC_APP_ID, Gua QA to ASC_APP_ID_DEV. Both are
          # bound here and the target picks one below, in shell.
          #
          # Deliberately NOT the obvious one-liner
          #   target == 'dev' AND secrets.ASC_APP_ID_DEV OR secrets.ASC_APP_ID
          # GitHub's `a && b || c` returns `c` whenever `b` is falsy, so an unset or emptied
          # ASC_APP_ID_DEV would silently aim a QA build at the PRODUCTION app record instead
          # of failing. Selecting in shell fails closed on a missing id.
          ASC_APP_ID_PROD: ${{ secrets.ASC_APP_ID }}
          ASC_APP_ID_DEV: ${{ secrets.ASC_APP_ID_DEV }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = "dev" ]; then
            ASC_APP_ID="${ASC_APP_ID_DEV:-}"
          else
            ASC_APP_ID="${ASC_APP_ID_PROD:-}"
          fi
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::No App Store Connect app id for target '$TARGET_ENV' (set ASC_APP_ID for prod, ASC_APP_ID_DEV for dev). See docs/TESTFLIGHT.md"
            exit 1
          fi
          # Last line of defence against shipping the wrong build to the wrong record: the
          # target, the bundle id baked into the archive and the app record must all agree.
          case "$TARGET_ENV:$BUNDLE_ID" in
            dev:global.gua.dev|prod:global.gua) ;;
            *) echo "::error::target/bundle mismatch: target '$TARGET_ENV' with bundle '$BUNDLE_ID'. Refusing to upload."; exit 1 ;;
          esac
          if [ "$TARGET_ENV" = "dev" ] && [ "$ASC_APP_ID" = "${ASC_APP_ID_PROD:-}" ]; then
            echo "::error::ASC_APP_ID_DEV resolves to the production app record. Refusing to upload a QA build to the production app."
            exit 1
          fi
          echo "Uploading $IPA_PATH (build $BUILD_NUMBER) to TestFlight"
          # Pin the destination app explicitly with --apple-id/--bundle-id so the
          # upload can't be routed to the wrong app record on a multi-app account.
          # --apiKeyPath points at the $RUNNER_TEMP key. altool may exit 0 even on
          # failure, so verify the success marker in the captured output too.
          xcrun altool --upload-package "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --apiKeyPath "$ASC_KEY_PATH" \
            --apple-id "$ASC_APP_ID" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_NUMBER" \
            --bundle-short-version-string "$MARKETING_VERSION" \
            2>&1 | tee altool-upload.log
          if grep -qi 'No errors uploading' altool-upload.log; then
            echo "Upload succeeded."
          else
            echo "::error::altool upload failed (see log above) — nothing was delivered to TestFlight."
            exit 1
          fi

      - name: Record 'What to Test' note
        # Only a manual run carries this input; the other triggers have no such field.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.whats_new != '' }}
        env:
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          echo "What to Test:"
          printf '%s\n' "$WHATS_NEW"

      - name: Tell the PR where it went
        # Testers need the build number to know which of several QA builds is this PR's;
        # TestFlight's own list only shows version + build, with no link back to the branch.
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          # Values are read from process.env / context rather than interpolated as ${{ }}
          # into the script body. MARKETING_VERSION is sed'd out of the PR branch's own
          # project.yml, so interpolating it would let branch content become JavaScript in a
          # step holding a pull-requests:write token.
          script: |
            const { MARKETING_VERSION, BUILD_NUMBER, DEPLOY_LABEL } = process.env;
            const sha = context.payload.pull_request.head.sha;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Uploaded to **Gua QA** TestFlight: \`${MARKETING_VERSION} (${BUILD_NUMBER})\`, built from ${sha}.\n\nIt takes a few minutes to finish processing before it appears to testers. Pushing more commits while the \`${DEPLOY_LABEL}\` label is on rebuilds and supersedes this build.`
            });

      - name: Upload archive artifact
        # Prod archives only. A QA archive embeds the injected dev backend URLs as plain
        # string literals in the binary, and on a PUBLIC repo anyone can download a run's
        # artifacts — which would republish the exact hostnames GUA_DEV_* exists to keep out
        # of the repo. For a QA build the run log is the debugging surface instead.
        if: always() && needs.gate.outputs.target != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: Gua-${{ env.BUILD_NUMBER }}-xcarchive
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 5
          if-no-files-found: warn

      - name: Clean up API key
        # The .p8 is a high-value credential (App Manager role). $RUNNER_TEMP is
        # wiped on hosted runners, but on a self-hosted Mac runner $HOME/$RUNNER_TEMP
        # can persist, so shred the key explicitly. Runs even when earlier steps fail.
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          rm -f \
            "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${ASC_KEY_JSON:-/nonexistent}" || true
          # Same reasoning for the signing identity: drop the throwaway keychain and
          # put the login keychain back as default, so a self-hosted runner is left
          # exactly as it was found.
          if [ -n "${GUA_SIGNING_KEYCHAIN:-}" ]; then
            security default-keychain -s login.keychain-db 2>/dev/null || true
            security delete-keychain "$GUA_SIGNING_KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/dist.p12" || true
