name: Danger CI

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions: {}

jobs:
  build:
    name: Danger
    runs-on: ubuntu-latest
    # The action builds its container image on every run, and a slow package mirror can stall it.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      statuses: write

    concurrency:
      group: ${{ format('danger-ci-{0}', github.ref) }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The dockerized action bundles its own danger-js runtime; the brew tap's packaged binary
      # crashes fetching PR data.
      #
      # Pinned past 3.22.1: that release's image installs Node 18, and the unpinned danger-js inside it
      # needs Node 20 or later ("ReferenceError: File is not defined"). Move back to a tag once one
      # ships with Node 20 or later.
      - name: Danger
        uses: danger/swift@53887414329bbf7deecde31f7d1d20bb15e6c4d3 # master, 2026-08-24, Node 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
