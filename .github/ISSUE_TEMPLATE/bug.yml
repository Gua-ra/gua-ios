name: Bug report for Gua for iOS
description: Report a problem with the Gua iOS app. Please [check open issues](https://github.com/Gua-ra/gua-ios/issues) first, in case it has already been reported.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Do not report security problems here. Follow [SECURITY.md](https://github.com/Gua-ra/gua-ios/blob/develop/SECURITY.md) instead.
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Please attach screenshots, videos or logs if you can.
      placeholder: Tell us what you see!
      value: |
        1. Where are you starting? What can you see?
        2. What do you tap?
        3. More steps…
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Outcome
      placeholder: Tell us what went wrong
      value: |
        #### What did you expect?

        #### What happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your phone model
      placeholder: e.g. iPhone 16
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: iOS version
      placeholder: e.g. iOS 18.1.1, under "Software Version"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Application version
      description: Shown at the bottom of the Settings screen.
      placeholder: |
        e.g. Version: 1.1.1 (48)
    validations:
      required: false
