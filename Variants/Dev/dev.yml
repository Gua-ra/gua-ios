# QA app variant: a second installable app that talks to the dev backend, so the shipping app
# (global.gua) can be a real production build.
#
# Applied by `fastlane config_dev`, which appends this file to project.yml's include list and
# regenerates, like the upstream Nightly variant.
#
# A separate bundle id rather than a build configuration: the two apps must install side by side
# and register different custom URL schemes. MAS reverses the redirect scheme and requires it to
# match the client_uri host as a prefix, so `global.gua.dev:/oidc` still pairs with client_uri
# `https://gua.global` and needs no server-side change.
settings:
  APP_GROUP_IDENTIFIER: group.global.gua.dev
  BASE_BUNDLE_IDENTIFIER: global.gua.dev
  OIDC_REDIRECT_URL: global.gua.dev:/oidc

targets:
  ElementX:
    sources:
      - path: Resources
    settings:
      base:
        # Must be overridden per target: project.yml sets it on the target, so a top-level override
        # here is ignored. It also becomes the OIDC client_name MAS shows, which tells the two apps apart.
        APP_DISPLAY_NAME: Gua QA
        # Feeds PRODUCT_NAME and so CFBundleName, which Xcode prefills as the App Store Connect
        # record name.
        APP_NAME: Gua QA
        # Own icon, so the QA app is distinguishable at a glance. The bundle id family stays
        # global.gua.dev: renaming identifiers would orphan the existing app record.
        ASSETCATALOG_COMPILER_APPICON_NAME: QAAppIcon
      configs:
        Release:
          # Points Release archives of this variant at the dev backend. The dev hosts are not
          # committed; CI injects them into Secrets/Secrets.swift.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GUA_DEVELOPMENT"

  # The hosted test targets derive TEST_HOST from $(APP_NAME) and would otherwise look for Gua.app.
  UnitTests:
    settings:
      base:
        APP_NAME: Gua QA
  PreviewTests:
    settings:
      base:
        APP_NAME: Gua QA
