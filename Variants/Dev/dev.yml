settings:
  APP_GROUP_IDENTIFIER: group.global.gua.dev
  BASE_BUNDLE_IDENTIFIER: global.gua.dev
  OIDC_REDIRECT_URL: global.gua.dev:/oidc

targets:
  ElementX:
    sources:
      - path: Resources
    settings:
      base:
        # Must be overridden per target: project.yml sets it on the target, so a top-level override here is ignored.
        APP_DISPLAY_NAME: Gua QA
        APP_NAME: Gua QA
        # The bundle id family stays global.gua.dev: renaming identifiers would orphan the existing app record.
        ASSETCATALOG_COMPILER_APPICON_NAME: QAAppIcon
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GUA_DEVELOPMENT"

  # The hosted test targets derive TEST_HOST from $(APP_NAME) and would otherwise look for Gua.app.
  UnitTests:
    settings:
      base:
        APP_NAME: Gua QA
  PreviewTests:
    settings:
      base:
        APP_NAME: Gua QA
